<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            padding-left: 190px;
            padding-right: 190px;
        }

        header.banner {
            position: fixed;
            top: 0;
            left: 190px;
            right: 190px;
            height: 90px;
            background-color: rgba(255, 255, 224, 0.5);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 0.15cm;
            font-family: 'Times New Roman', serif;
            color: #555555;
            font-size: 20pt;
            z-index: 1000;
        }

        .main-container {
            display: flex;
            margin-top: 90px;
            position: relative;
        }

        nav {
            width: 2cm;
            flex-shrink: 0;
            padding-top: 0.35cm;
            position: fixed;
            top: 90px;
            left: 190px;
            z-index: 100;
        }

        .nav-item {
            width: 2cm;
            height: 0.35cm;
            background-color: #d3d3d3;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.1cm;
            font-family: 'Times New Roman', serif;
            color: blue;
            font-size: 9pt;
            white-space: nowrap;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .nav-item:hover {
            background-color: #ffc0cb;
        }

        .content-wrapper {
            flex-grow: 1;
            margin-left: calc(2cm + 0.25cm);
            padding-right: 20px;
        }

        .scene-section {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            font-family: 'Times New Roman', serif;
            font-size: 18pt;
            font-weight: normal;
            padding-top: 0.5cm;
            background-color: #ffffff;
            scroll-margin-top: 90px;
        }

        .scene-section.jump-target {
            padding-top: 0 !important;
        }

        aside.supporting {
            width: 2cm;
            height: 3.1cm;
            background-color: #ffc0cb;
            position: relative;
            margin-top: 0;
            flex-shrink: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding-top: 0.15cm;
            padding-left: 0.15cm;
            font-family: 'Times New Roman', serif;
            font-size: 9pt;
            color: #000000;
        }

        footer {
            height: 50px;
            background-color: #555555;
            color: #000000;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding-top: 0;
            padding-left: 0;
            font-family: 'Times New Roman', serif;
            font-size: 12pt;
            clear: both;
            position: relative;
            z-index: 100;
        }
    </style>
</head>
<body>

    <header class="banner">
        Here is Banner
    </header>

    <div class="main-container">
        <nav>
            <a href="#scene1" class="nav-item" data-target="scene1">Scene01</a>
            <a href="#scene2" class="nav-item" data-target="scene2">Scene02</a>
            <a href="#scene3" class="nav-item" data-target="scene3">Scene03</a>
            <a href="#scene4" class="nav-item" data-target="scene4">Scene04</a>
        </nav>

        <div class="content-wrapper">
            <div id="scene1" class="scene-section">Scene01</div>
            <div id="scene2" class="scene-section">Scene02</div>
            <div id="scene3" class="scene-section">Scene03</div>
            <div id="scene4" class="scene-section">Scene04</div>
        </div>

        <aside class="supporting">
            Information
        </aside>
    </div>

    <footer>
        Here is footer
    </footer>

    <script>
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('data-target');
                const targetElement = document.getElementById(targetId);
                
                document.querySelectorAll('.scene-section').forEach(sec => {
                    sec.classList.remove('jump-target');
                });
                
                targetElement.classList.add('jump-target');
                
                const bannerHeight = 90;
                const elementPosition = targetElement.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - bannerHeight;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            });
        });
    </script>

</body>
</html>
